name: Payment Service CI

on:
  pull_request:
    branches:
      - development
      - staging
      - main

  push:
    branches:
      - development
      - staging
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run Linter
        run: pnpm lint

      - name: Type Check
        run: pnpm build

      - name: Run Tests
        run: pnpm test
        env:
          NODE_ENV: test
          PORT: 3001
          SERVICE_NAME: spotq-payment-service
          LOG_LEVEL: info
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotq
          REDIS_URL: redis://localhost:6379
          RAZORPAY_TEST_API_KEY: test_key_id
          RAZORPAY_TEST_SECRET_KEY: test_key_secret
          QUEUE_PREFIX: spotq_payment

      - name: Build Docker Image
        run: docker build -t payment-service .
